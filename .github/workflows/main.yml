name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A93059: ${{ secrets.A93059 }}
          BE50E2: ${{ secrets.BE50E2 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A93059', '')
          meta_b = os.environ.get('BE50E2', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 8b46eeebacf92ab5aa89ab2b26c0f89df6 -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 2105d175d92a7f2197e83c34472ab6aa92fe3a7171 -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
